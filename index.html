      '<td class="num dim">' + (j.snapshots || []).length + '</td>' +
      '<td class="num">' + money(t.total) + '</td>' +
      '<td><button class="btn" data-dupjob="' + j.id + '">dup</button> ' +
      '<button class="x" data-deljob="' + j.id + '">✕</button></td></tr>';
  }).join('');
  const snaps = (cur && cur.snapshots || []).map(s =>
    '<tr><td><b>' + esc(s.label) + '</b></td><td class="dim">' + esc(s.at.slice(0, 16).replace('T', ' ')) +
    '</td><td class="num">' + money(s.totals.total) + '</td>' +
    '<td><button class="btn" data-restore="' + s.id + '">restore</button> ' +
    '<button class="x" data-delsnap="' + s.id + '">✕</button></td></tr>').join('');
  modal(
   '<div class="modal md"><div class="mhead"><h2>Jobs</h2><div class="spring"></div>' +
   '<button class="btn pri" id="jbNew">+ new job</button><button class="btn" data-close>close</button></div>' +
   '<div class="mbody flush"><table class="grid"><thead><tr><th>Name</th><th style="width:86px">Modified</th>' +
   '<th class="num" style="width:56px">Lines</th><th class="num" style="width:56px">Snaps</th>' +
   '<th class="num" style="width:88px">Total</th><th style="width:86px"></th></tr></thead><tbody>' +
   (rows || '<tr><td colspan="6" class="dim" style="padding:14px">no jobs</td></tr>') + '</tbody></table>' +
   (snaps ? '<div class="shead" style="position:static"><h2>Snapshots of ' + esc(cur.name) + '</h2></div>' +
     '<table class="grid"><tbody>' + snaps + '</tbody></table>' : '') +
   '</div><div class="mfoot"><span class="dim">Snapshots freeze the numbers so you can change assumptions and compare.</span></div></div>',
  (v) => {
    $('#jbNew', v).onclick = () => { newJob('Untitled job'); closeModal(); save(); render(); };
    v.addEventListener('click', (e) => {
      const d = (s) => { const el = e.target.closest('[' + s + ']'); return el ? el.getAttribute(s) : null; };
      let id;
      if ((id = d('data-dupjob'))) {
        const src = jobById(id);
        const copy = JSON.parse(JSON.stringify(src));
        copy.id = uid(); copy.name = src.name + ' copy'; copy.snapshots = [];
        copy.lines.forEach(l => l.id = uid());
        DB.jobs.unshift(copy); DB.activeJobId = copy.id;
        closeModal(); save(); render(); return;
      }
      if ((id = d('data-deljob'))) {
        DB.jobs = DB.jobs.filter(x => x.id !== id);
        if (DB.activeJobId === id) DB.activeJobId = DB.jobs[0] ? DB.jobs[0].id : null;
        closeModal(); save(); render(); return;
      }
      if ((id = d('data-restore'))) {
        const s = cur.snapshots.find(x => x.id === id);
        cur.lines = JSON.parse(JSON.stringify(s.lines));
        cur.globalWastePct = s.globalWastePct;
        closeModal(); touchJob(); render(); toast('Restored "' + s.label + '"'); return;
      }
      if ((id = d('data-delsnap'))) {
        cur.snapshots = cur.snapshots.filter(x => x.id !== id);
        closeModal(); save(); openJobs(); return;
      }
      if ((id = d('data-job'))) { DB.activeJobId = id; closeModal(); save(); render(); }
    });
  });
}

function takeSnapshot() {
  const j = activeJob(); if (!j) return;
  const label = prompt('Label this snapshot', 'v' + ((j.snapshots || []).length + 1));
  if (label == null) return;
  const t = computeJob(j);
  (j.snapshots = j.snapshots || []).unshift({
    id: uid(), label: label || ('v' + (j.snapshots.length + 1)), at: new Date().toISOString(),
    lines: JSON.parse(JSON.stringify(j.lines)), globalWastePct: j.globalWastePct,
    totals: { subtotal: t.subtotal, taxTotal: t.taxTotal, total: t.total },
    groups: t.groups.map(g => ({ label: g.label, buyLabel: g.buyLabel, amount: g.amount })),
  });
  save(); render(); toast('Snapshot "' + label + '" taken');
}

function openCompare() {
  const j = activeJob();
  if (!j || !(j.snapshots || []).length) { toast('Take a snapshot first'); return; }
  const t = computeJob(j);
  const opts = [{ id: '_cur', label: 'current', groups: t.groups.map(g => ({ label: g.label, buyLabel: g.buyLabel, amount: g.amount })), totals: { total: t.total } }]
    .concat(j.snapshots.map(s => ({ id: s.id, label: s.label, groups: s.groups, totals: s.totals })));
  const sel = (id, def) => '<select id="' + id + '">' + opts.map(o =>
    '<option value="' + o.id + '"' + (o.id === def ? ' selected' : '') + '>' + esc(o.label) + '</option>').join('') + '</select>';
  modal(
   '<div class="modal md"><div class="mhead"><h2>Compare</h2><div class="spring"></div>' +
   '<button class="btn" data-close>close</button></div><div class="mbody">' +
   '<div class="cols"><div class="field"><label>A</label>' + sel('cmpA', j.snapshots[0].id) + '</div>' +
   '<div class="field"><label>B</label>' + sel('cmpB', '_cur') + '</div></div>' +
   '<div id="cmpOut"></div></div></div>',
  (v) => {
    const draw = () => {
      const A = opts.find(o => o.id === $('#cmpA', v).value) || opts[1] || opts[0];
      const B = opts.find(o => o.id === $('#cmpB', v).value) || opts[0];
      const keys = Array.from(new Set(A.groups.concat(B.groups).map(g => g.label)));
      let h = '<table class="grid"><thead><tr><th>Material</th>' +
        '<th class="num">' + esc(A.label) + '</th><th class="num">' + esc(B.label) + '</th>' +
        '<th class="num" style="width:90px">Δ</th></tr></thead><tbody>';
      for (const k of keys) {
        const a = A.groups.find(g => g.label === k), b = B.groups.find(g => g.label === k);
        const av = a ? a.amount : 0, bv = b ? b.amount : 0, d = bv - av;
        h += '<tr><td>' + esc(k) + '</td><td class="num' + (a ? '' : ' dim') + '">' + (a ? money(av) : '—') +
          '</td><td class="num' + (b ? '' : ' dim') + '">' + (b ? money(bv) : '—') + '</td>' +
          '<td class="num" style="color:' + (Math.abs(d) < 0.005 ? 'var(--text-dim)' : d > 0 ? 'var(--accent)' : 'var(--green)') +
          '">' + (Math.abs(d) < 0.005 ? '—' : (d > 0 ? '+' : '') + money(d)) + '</td></tr>';
      }
      const d = B.totals.total - A.totals.total;
      h += '<tr class="grp"><td>TOTAL</td><td class="num">' + money(A.totals.total) + '</td>' +
        '<td class="num">' + money(B.totals.total) + '</td><td class="num">' +
        (d > 0 ? '+' : '') + money(d) + '</td></tr></tbody></table>';
      $('#cmpOut', v).innerHTML = h;
    };
    draw();
    v.addEventListener('change', draw);
  });
}

function openHelp() {
  modal('<div class="modal md"><div class="mhead"><h2>Tally</h2><div class="spring"></div>' +
   '<button class="btn" data-close>close</button></div><div class="mbody" style="line-height:1.85">' +
   '<p><b>What it is.</b> An estimating scratchpad, not a quote generator. Manual entry is the spine; ' +
   'recipes are a helper that drops rows into the job.</p><br>' +
   '<p><b>Keys.</b> <kbd>/</kbd> add material · <kbd>R</kbd> run recipe · <kbd>S</kbd> snapshot · ' +
   '<kbd>N</kbd> new job · <kbd>1-5</kbd> tabs · <kbd>U</kbd> flip units · <kbd>Esc</kbd> close</p><br>' +
   '<p><b>Dimensions.</b> Type them the way you say them: <code>4\'6 1/2</code>, <code>10\'</code>, ' +
   '<code>24"</code>, <code>4.54</code>. A bare number is feet.</p><br>' +
   '<p><b>Waste.</b> Resolved per row as line override → material default → job global. ' +
   'The mark next to the percentage says which won: <code>↑</code> job, <code>▪</code> material, <code>✎</code> line.</p><br>' +
   '<p><b>What it does not do.</b> No 2D sheet nesting — sheet counts are an area estimate with a ' +
   'fits/does-not-fit check, and they say so. No cross-vendor comparison yet; each vendor list stands alone.</p><br>' +
   '<p><b>Storage.</b> IndexedDB, with a localStorage hot slot as the crash survivor. ' +
   'Nothing leaves this browser. Add <code>?test</code> to the URL to run the self-checks.</p>' +
   '</div></div>');
}

function wirePane() {
  const pane = $('#pane');

  const cs = $('#catSearch');
  if (cs) cs.oninput = () => {
    State.search = cs.value;
    const cat = activeCatalog(); const q = State.search.toLowerCase();
    $$('#pane tbody tr[data-item]').forEach(tr => {
      const it = itemById(cat, tr.dataset.item);
      tr.style.display = (!q || (it.code + ' ' + it.description + ' ' + it.unit).toLowerCase().includes(q)) ? '' : 'none';
    });
  };
  const cp = $('#catPick');
  if (cp) cp.onchange = () => { const j = activeJob(); if (j) { j.catalogId = cp.value; touchJob(); } render(); };

  pane.onclick = (e) => {
    const act = e.target.closest('[data-act]');
    if (act) return paneAction(act.dataset.act);

    let el;
    if ((el = e.target.closest('[data-waste]'))) {
      const g = CALC.groups.find(x => x.key === el.dataset.waste);
      return editCell(el, g.wastePct, (v) => {
        const n = v.trim() === '' ? null : parseFloat(v);
        for (const l of g.sources) l.wastePctOverride = (n == null || isNaN(n)) ? null : n;
        touchJob(); render();
      });
    }
    if ((el = e.target.closest('[data-delline]'))) {
      const j = activeJob(); j.lines = j.lines.filter(l => l.id !== el.dataset.delline);
      touchJob(); return render();
    }
    if ((el = e.target.closest('[data-delrun]'))) {
      const j = activeJob(); j.lines = j.lines.filter(l => l.runId !== el.dataset.delrun);
      touchJob(); return render();
    }
    if ((el = e.target.closest('[data-redo]'))) return openRun(null, el.dataset.redo);
    if ((el = e.target.closest('[data-runrecipe]'))) return openRun(el.dataset.runrecipe);
    if ((el = e.target.closest('[data-editrecipe]'))) return openRecipeEdit(el.dataset.editrecipe);
    if ((el = e.target.closest('[data-duprecipe]'))) {
      const r = JSON.parse(JSON.stringify(recipeById(el.dataset.duprecipe)));
      r.id = uid(); r.name += ' copy'; r.builtin = false;
      DB.recipes.push(r); save(); return render();
    }
    if ((el = e.target.closest('[data-delrecipe]'))) {
      DB.recipes = DB.recipes.filter(r => r.id !== el.dataset.delrecipe); save(); return render();
    }
    if ((el = e.target.closest('[data-delitem]'))) {
      const cat = activeCatalog();
      cat.items = cat.items.filter(i => i.id !== el.dataset.delitem);
      bumpCatalog(cat); save(); return render();
    }
    if ((el = e.target.closest('[data-delvendor]'))) {
      const id = el.dataset.delvendor;
      if (!confirm('Delete this vendor and its price lists?')) return;
      DB.vendors = DB.vendors.filter(v => v.id !== id);
      DB.catalogs = DB.catalogs.filter(c => c.vendorId !== id);
      save(); return render();
    }

    // editable cells
    const td = e.target.closest('td.ed');
    if (!td) return;
    const tr = td.closest('tr');
    const f = td.dataset.f;
    if (tr.dataset.item) {
      const cat = activeCatalog(), it = itemById(cat, tr.dataset.item);
      const cur = f === 'stock' ? stockText(it.stock)
        : f === 'class' ? (it.classOverride || classLabelOf(it))
        : f === 'wastePct' ? (it.wastePct == null ? '' : it.wastePct)
        : it[f];
      editCell(td, cur, (v) => {
        if (f === 'stock') it.stock = parseStockText(v, it);
        else if (f === 'class') it.classOverride = v.trim() && v.trim() !== classLabelOf(Object.assign({}, it, { classOverride: null })) ? v.trim() : null;
        else if (f === 'wastePct') it.wastePct = v.trim() === '' ? null : (parseFloat(v) || 0);
        else if (f === 'price') it.price = parseFloat(v) || 0;
        else it[f] = v.trim();
        bumpCatalog(cat); save(); render();
      });
    } else if (tr.dataset.vendor) {
      const ven = vendorById(tr.dataset.vendor);
      editCell(td, ven[f], (v) => { ven[f] = v.trim(); save(); render(); });
    }
  };
}

function paneAction(a) {
  if (a === 'import') return openImport();
  if (a === 'add') return openAdd();
  if (a === 'run') return openRun();
  if (a === 'newitem') {
    const cat = activeCatalog(); if (!cat) return openImport();
    cat.items.unshift({ id: uid(), code: 'NEW' + (cat.items.length + 1), unit: 'ea',
      description: 'New material', taxCode: 'H', price: 0, stock: null, wastePct: null, classOverride: null });
    bumpCatalog(cat); save(); return render();
  }
  if (a === 'newrecipe') {
    const r = { id: uid(), name: 'New recipe', note: '', builtin: false,
      params: [{ key: 'W', label: 'Width', type: 'length', default: 4 },
               { key: 'H', label: 'Height', type: 'length', default: 8 }],
      binds: [{ key: 'frame', label: 'Frame stock', kind: 'linear', hint: '' }],
      parts: [{ label: 'Part', bind: 'frame', kind: 'linear', qty: '1', length: 'W' }] };
    DB.recipes.push(r); save(); render(); return openRecipeEdit(r.id);
  }
  if (a === 'resetrecipes') {
    const have = new Set(DB.recipes.map(r => r.id));
    for (const r of builtinRecipes()) if (!have.has(r.id)) DB.recipes.push(r);
      else Object.assign(DB.recipes.find(x => x.id === r.id), r);
    save(); return render();
  }
  if (a === 'csv') {
    download('tally-cutlist-' + todayISO() + '.csv', cutListCSV(), 'text/csv');
    return toast('Cut list exported');
  }
}

function bindGlobal() {
  $$('.tab').forEach(t => t.onclick = () => {
    if (t.id === 'btnHelp') return openHelp();
    State.tab = t.dataset.tab; State.search = ''; render();
  });
  $('#btnHelp').onclick = openHelp;
  $('#btnJobs').onclick = openJobs;
  $('#btnSnap').onclick = takeSnapshot;
  $('#btnCompare').onclick = openCompare;
  $('#uFrac').onclick = () => { State.units = DB.units = 'frac'; save(); render(); };
  $('#uDec').onclick  = () => { State.units = DB.units = 'dec';  save(); render(); };
  $('#jobName').oninput = () => { const j = activeJob(); if (j) { j.name = $('#jobName').value; touchJob(); } };
  $('#globalWaste').onchange = () => {
    const j = activeJob(); if (!j) return;
    j.globalWastePct = clamp(parseFloat($('#globalWaste').value) || 0, 0, 200);
    touchJob(); render();
  };
  $('#veil').addEventListener('click', (e) => {
    if (e.target.id === 'veil' || e.target.closest('[data-close]')) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (!$('#veil').classList.contains('hide')) { e.preventDefault(); closeModal(); } return; }
    const t = e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (!$('#veil').classList.contains('hide')) return;
    const k = e.key.toLowerCase();
    if (k === '/') { e.preventDefault(); openAdd(); }
    else if (k === 'r') { e.preventDefault(); openRun(); }
    else if (k === 's') { e.preventDefault(); takeSnapshot(); }
    else if (k === 'n') { e.preventDefault(); newJob('Untitled job'); save(); render(); }
    else if (k === 'u') { State.units = DB.units = State.units === 'frac' ? 'dec' : 'frac'; save(); render(); }
    else if (k === '?') openHelp();
    else if ('12345'.includes(k)) {
      State.tab = ['job', 'catalog', 'recipes', 'cutlist', 'vendors'][+k - 1]; render();
    }
  });
  window.addEventListener('beforeunload', () => { if (State.dirty) persist(); });
}

/* ==================================================================
   TESTS  —  ?test in the URL
   ================================================================== */
function runTests() {
  const T = [];
  const near = (a, b, tol) => a != null && Math.abs(a - b) < (tol || 1e-9);
  const t = (name, ok, detail) => T.push({ name, ok: !!ok, detail: detail || '' });

  // --- units ---
  t("parseLen 4'6 1/2", near(parseLen("4'6 1/2"), 4 + 6.5 / 12), String(parseLen("4'6 1/2")));
  t("parseLen 4' 6-1/2\"", near(parseLen("4' 6-1/2\""), 4 + 6.5 / 12), String(parseLen("4' 6-1/2\"")));
  t('parseLen 54.5"', near(parseLen('54.5"'), 54.5 / 12), String(parseLen('54.5"')));
  t("parseLen 10'", near(parseLen("10'"), 10), String(parseLen("10'")));
  t('parseLen 4.54', near(parseLen('4.54'), 4.54), String(parseLen('4.54')));
  t('parseLen 264 is feet', near(parseLen('264'), 264), String(parseLen('264')));
  t('parseLen 24"', near(parseLen('24"'), 2), String(parseLen('24"')));
  t('parseLen 1/2"', near(parseLen('1/2"'), 1 / 24), String(parseLen('1/2"')));
  t('parseLen rubbish -> null', parseLen('four feet') === null, String(parseLen('four feet')));
  t('parseLen empty -> null', parseLen('') === null, String(parseLen('')));
  t("fmtLen frac", fmtLen(4 + 6.5 / 12, 'frac') === '4\'-6½"', fmtLen(4 + 6.5 / 12, 'frac'));
  t("fmtLen whole", fmtLen(10, 'frac') === '10\'-0"', fmtLen(10, 'frac'));
  t('fmtLen dec', fmtLen(4.54, 'dec') === "4.54'", fmtLen(4.54, 'dec'));
  t('fmtLenTight sub-foot', fmtLenTight(0.125, 'frac') === '1½"', fmtLenTight(0.125, 'frac'));
  t('round trip 1/16', near(parseLen(fmtLen(9 + 10.5 / 12, 'frac')), 9 + 10.5 / 12, 1e-6));

  // --- expressions ---
  t('expr max/ceil', evalExpr('max(2, ceil(W/2)+1)', { W: 4 }) === 3);
  t('expr inches', near(evalExpr('H - 1.5in', { H: 10 }), 9.875));
  t('expr toggles', evalExpr('max(0, ceil(H/toggle_spc) - 1)', { H: 10, toggle_spc: 2 }) === 4);
  t('expr quoted inches', near(evalExpr('24"'), 2));
  t('expr precedence', evalExpr('2 + 3 * 4') === 14);
  let threw = false; try { evalExpr('nope(1)'); } catch (_) { threw = true; }
  t('expr rejects unknown fn', threw);
  threw = false; try { evalExpr('W + 1', {}); } catch (_) { threw = true; }
  t('expr rejects unknown name', threw);
  threw = false; try { evalExpr('1/0'); } catch (_) { threw = true; }
  t('expr rejects /0', threw);

  // --- inference ---
  const inf = (d, u) => inferStock(d, u, '');
  let s = inf('1x3x16 #1 Pine', 'ft');
  t('infer 1x3x16', s && s.kind === 'linear' && s.nominal === '1x3' && s.len === 16, JSON.stringify(s));
  s = inf('3/4 4x8 MDF', 'sht');
  t('infer 3/4 4x8 MDF', s && s.kind === 'sheet' && s.w === 4 && s.h === 8 && s.thick === '3/4', JSON.stringify(s));
  s = inf('3/4x4x8 Pine CDX Sheathing', 'sht');
  t('infer 3/4x4x8 sheet', s && s.kind === 'sheet' && s.w === 4 && s.h === 8, JSON.stringify(s));
  s = inf('2x4x8 Spruce, stud grade', 'pc');
  t('infer stud by the piece', s && s.kind === 'linear' && s.nominal === '2x4' && s.len === 8, JSON.stringify(s));
  s = inf('1/4 5x12 MDF', 'sht');
  t('infer 5x12 sheet', s && s.kind === 'sheet' && s.w === 5 && s.h === 12, JSON.stringify(s));
  s = inf('19mm 4x8 Poplar G1S Bessmer', 'sht');
  t('infer mm thickness', s && s.kind === 'sheet' && s.thick === '19mm', JSON.stringify(s));
  s = inf('Titebond 3', 'pail');
  t('infer consumable -> null', s === null, JSON.stringify(s));
  s = inf('1x12 Rough Pine', 'ft');
  t('infer nominal without length flags review', s && s.kind === 'linear' && s.len === null && stockNeedsReview(s), JSON.stringify(s));

  // --- sheets ---
  t('panelsPerSheet 4x8 on 4x8', panelsPerSheet(4, 8, 4, 8) === 1);
  t('panelsPerSheet 4x10 on 4x8 = 0', panelsPerSheet(4, 10, 4, 8) === 0);
  t('panelsPerSheet 2x4 on 4x8 = 4', panelsPerSheet(2, 4, 4, 8) === 4);
  t('panelsPerSheet rotates', panelsPerSheet(8, 4, 4, 8) === 1);

  // --- nesting ---
  let n = nest1D([{ len: 4, qty: 4 }], [{ len: 16, cost: 13.76, itemId: 'a' }]);
  t('nest 4×4ft into 16ft respects kerf', n.sticks === 2, 'sticks=' + n.sticks);
  n = nest1D([{ len: 10, qty: 3 }], [{ len: 16, cost: 13.76, itemId: 'a' }]);
  t('nest 3×10ft = 3 sticks', n.sticks === 3, 'sticks=' + n.sticks);
  n = nest1D([{ len: 3.9, qty: 4 }], [{ len: 16, cost: 1, itemId: 'a' }]);
  t('nest 4×3.9ft = 1 stick', n.sticks === 1, 'sticks=' + n.sticks);
  const noReuse = nest1D([{ len: 3.9, qty: 4 }], [{ len: 16, cost: 1, itemId: 'a' }], { reuse: false });
  t('offcut reuse actually fires', noReuse.sticks > n.sticks, 'reuse=' + n.sticks + ' vs none=' + noReuse.sticks);
  n = nest1D([{ len: 4, qty: 2 }, { len: 12, qty: 1 }],
    [{ len: 12, cost: 10, itemId: 'a' }, { len: 16, cost: 13, itemId: 'b' }]);
  t('nest picks among stock lengths', n.sticks <= 2, 'sticks=' + n.sticks);
  t('nest never yields over 100%', n.yield <= 1 + 1e-9, 'yield=' + n.yield);
  n = nest1D([{ len: 20, qty: 1 }], [{ len: 16, cost: 13, itemId: 'a' }]);
  t('nest flags an over-long piece', n.tooLong.length === 1 && n.sticks === 0);

  // --- the arithmetic that matters: Hollywood flat ×8 @ 4'0 × 10'0 ---
  const rec = builtinRecipes()[0];
  const binds = { frame: { type: 'class', key: 'k1' }, skin: { type: 'class', key: 'k2' },
    screws: { type: 'item', itemId: 'i1' } };
  const ex = expandRecipe(rec, { W: 4, H: 10, toggle_spc: 2 }, binds, 8);
  const part = (name) => ex.lines.find(l => l.label.includes(name));
  const rails = part('Rail'), stiles = part('Stile'), tog = part('Toggle'), skin = part('Skin'), scr = part('Screws');
  t('flat: 16 rails @ 4ft',
    rails && rails.demand.pieces[0].qty === 16 && near(rails.demand.pieces[0].len, 4),
    rails && rails.demand.pieces[0].qty + ' @ ' + rails.demand.pieces[0].len);
  t("flat: 24 stiles @ 9'-10½\"",
    stiles && stiles.demand.pieces[0].qty === 24 && near(stiles.demand.pieces[0].len, 10 - 0.125),
    stiles && stiles.demand.pieces[0].qty + ' @ ' + fmtLen(stiles.demand.pieces[0].len, 'frac'));
  t("flat: 32 toggles @ 3'-10½\"",
    tog && tog.demand.pieces[0].qty === 32 && near(tog.demand.pieces[0].len, 4 - 0.125),
    tog && tog.demand.pieces[0].qty + ' @ ' + fmtLen(tog.demand.pieces[0].len, 'frac'));
  t('flat: 8 skins 4×10', skin && skin.demand.panels[0].qty === 8 &&
    near(skin.demand.panels[0].w, 4) && near(skin.demand.panels[0].h, 10));
  t('flat: 0.432 M screws', scr && near(scr.demand.bulk === undefined ? scr.demand.qty : 0, 0.432, 1e-9),
    scr && String(scr.demand.qty));
  const linLf = rails.demand.pieces[0].qty * 4 + stiles.demand.pieces[0].qty * 9.875 + tog.demand.pieces[0].qty * 3.875;
  t('flat: 435.0 lf of 1x3', near(linLf, 64 + 237 + 124, 0.001), linLf.toFixed(2) + ' lf');
  t('flat: no expansion problems', ex.problems.length === 0, ex.problems.join('; '));

  return T;
}

function openTests() {
  const T = runTests();
  const bad = T.filter(x => !x.ok);
  modal('<div class="modal md"><div class="mhead"><h2>Self-check</h2>' +
    '<span class="dim">' + (T.length - bad.length) + ' / ' + T.length + ' passed</span>' +
    '<div class="spring"></div><button class="btn" data-close>close</button></div><div class="mbody">' +
    '<pre class="log">' + T.map(x => (x.ok ? '<b class="ok">  ok</b>  ' : '<b class="no">FAIL</b>  ') +
      esc(x.name) + (x.detail && !x.ok ? '\n        got: ' + esc(x.detail) : '')).join('\n') + '</pre>' +
    '<div class="field" style="margin-top:12px"><label>End-to-end: verify a supplier PDF</label>' +
    '<input type="file" id="tFile" accept="application/pdf,.pdf">' +
    '<div class="hint">Reads the file and reports what it found, so you can hold the document ' +
    'next to the screen. Nothing is imported.</div></div><pre class="log" id="tOut" style="display:none"></pre>' +
    '</div></div>', (v) => {
      $('#tFile', v).onchange = async () => {
        const f = $('#tFile', v).files[0]; if (!f) return;
        const out = $('#tOut', v); out.style.display = ''; out.textContent = 'reading…';
        try {
          const r = await parseVendorPDF(await f.arrayBuffer());
          const need = r.items.filter(i => stockNeedsReview(inferStock(i.description, i.unit, i.code))).length;
          const kinds = { linear: 0, sheet: 0, unit: 0 };
          for (const i of r.items) kinds[(inferStock(i.description, i.unit, i.code) || { kind: 'unit' }).kind]++;
          out.textContent =
            'pages with text     ' + r.pages + '\n' +
            'priced rows read    ' + r.rowCount + '\n' +
            'repeated SKUs       ' + r.dupes.length + (r.dupes.length ? '  (' + Array.from(new Set(r.dupes)).join(', ') + ')' : '') + '\n' +
            'unique items        ' + r.items.length + '\n' +
            'rows as printed     ' + money(r.gross) + '   <- compare to the document subtotal\n' +
            (r.meta.subtotal != null ? 'subtotal on the doc ' + money(r.meta.subtotal) +
              (near(r.meta.subtotal, r.gross, 0.02) ? '   MATCH' : '   MISMATCH') + '\n' : '') +
            (r.meta.tax != null ? 'tax on the doc      ' + money(r.meta.tax) + '\n' : '') +
            'tax codes           ' + JSON.stringify(r.meta.taxRates) + '\n' +
            'inferred            ' + kinds.linear + ' linear, ' + kinds.sheet + ' sheet, ' + kinds.unit + ' by the unit\n' +
            'need a hand fix     ' + need + ' of ' + r.items.length +
              (need <= r.items.length * 0.14 ? '   (within tolerance)' : '   (heuristics need work)') + '\n' +
            'first row           ' + r.items[0].code + ' · ' + r.items[0].unit + ' · ' +
              r.items[0].description + ' · ' + r.items[0].taxCode + ' · ' + r.items[0].price.toFixed(2) + '\n' +
            'last row            ' + r.items[r.items.length - 1].code + ' · ' +
              r.items[r.items.length - 1].description + ' · ' + r.items[r.items.length - 1].price.toFixed(2);
        } catch (e) { out.textContent = 'FAILED: ' + e.message; }
      };
    });
  function near(a, b, tol) { return a != null && Math.abs(a - b) < tol; }
}

/* ==================================================================
   INIT
   ================================================================== */
(async function init() {
  await load();
  if (!DB.recipes.length) DB.recipes = builtinRecipes();
  if (!DB.jobs.length) newJob('Untitled job');
  State.units = DB.units || 'frac';
  bindGlobal();
  render();
  setStatus(DB.catalogs.length
    ? DB.catalogs.reduce((a, c) => a + c.items.length, 0) + ' priced rows across ' +
      DB.vendors.length + ' vendor' + (DB.vendors.length === 1 ? '' : 's')
    : 'no price list yet — Catalog → import');
  if (/[?&]test\b/.test(location.search)) openTests();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
